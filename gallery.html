<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs Illustrations</title>
<style>
  /* The figure stands loose on the page: its plates take the panel's own
     background (--ground), and edge/mid/lo are the blue mixed into it. */
  :root { --text: #1B1C1F; --muted: #6B6F76; --rule: #E4E6EA; --page: #F5F6F8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  header { padding: 32px 24px 8px; max-width: 1120px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1120px; margin: 0 auto; padding: 16px 24px 48px; display: grid; gap: 24px; }
  .fig { background: #fff; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .fig h2 { margin: 0; padding: 16px 20px 2px; font-size: 16px; }
  .fig .meta { padding: 0 20px 14px; color: var(--muted); font-size: 13px; }
  .fig .meta code { font-size: 12px; }
  .panels { display: grid; border-top: 1px solid var(--rule); }
  .panel { padding: 16px 20px 20px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; background: var(--ground); }
  .panel + .panel { border-top: 1px solid var(--rule); }
  .panel.light { --ground: #FFFFFF; --bright: #1988CF; color: var(--muted); }
  .panel.dark { --ground: #101216; --bright: #6CC0F5; color: #8A8F98; }
  .cell { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-family: ui-monospace, monospace; }
  .hl-stage {
    --hairline-plate: var(--ground);
    --hairline-hi: var(--bright);
    --hairline-edge: color-mix(in srgb, #1988CF 88%, var(--ground));
    --hairline-mid: color-mix(in srgb, #1988CF 62%, var(--ground));
    --hairline-lo: color-mix(in srgb, #1988CF 38%, var(--ground));
    --hairline-stroke: 1.1;
    pointer-events: none;
  }
  .hover { cursor: pointer; border-radius: 8px; outline-offset: 4px; }
  .hover:focus-visible { outline: 1.5px solid var(--bright); }
  .w120 { width: 120px; } .w400 { width: 400px; max-width: 100%; }
  .static img { width: 400px; max-width: 100%; display: block; }
</style>
</head>
<body>
<header>
  <h1>TomTom Docs illustrations</h1>
  <p>Hover a figure to play its tour. Each section shows the animated figure at 120px and 400px, in light and dark, and the static SVG for Docs.</p>
</header>
<main id="list"></main>

<script src=".claude/skills/hairline-create/kernel.js"></script>
<script>
/* Every figure is in the hairline-create skill's format: it reads `HL` and
   ends with `hairline({...})`. Each is run in its own function scope, so the
   figures' top-level names never meet. */
const TRAVEL = 650, DWELL = 900, GAP = 700;
const ease = (t) => 1 - Math.pow(1 - t, 3);

/* The stage's own mapping (kernel `pointer`): client px over its rect → 400×320. */
function emit(stage, type, [x, y]) {
  const r = stage.getBoundingClientRect();
  stage.dispatchEvent(new PointerEvent(type, {
    pointerType: "mouse", pointerId: 1, bubbles: false,
    clientX: r.left + (x / 400) * r.width, clientY: r.top + (y / 320) * r.height,
  }));
}

/* Walks the figure's tour with an unseen pointer, from the first stop, with no lead-in. */
function driver(stage, stops) {
  let raf = 0, from = null, i = 0, t0 = 0, phase = "travel";
  const step = (now) => {
    const stop = stops[i];
    if (phase === "travel") {
      if (stop === null) { from = null; emit(stage, "pointerleave", [200, 160]); phase = "wait"; t0 = now; }
      else {
        const k = from ? ease(Math.min(1, (now - t0) / TRAVEL)) : 1, a = from ?? stop;
        emit(stage, "pointermove", [a[0] + (stop[0] - a[0]) * k, a[1] + (stop[1] - a[1]) * k]);
        if (k >= 1) { from = stop; phase = "wait"; t0 = now; }
      }
    } else if (now - t0 >= (stop === null ? GAP : DWELL)) { i = (i + 1) % stops.length; phase = "travel"; t0 = now; }
    raf = requestAnimationFrame(step);
  };
  return {
    start() { if (raf || HL.reducedMotion()) return; i = 0; from = null; phase = "travel"; t0 = performance.now(); raf = requestAnimationFrame(step); },
    stop() { if (!raf) return; cancelAnimationFrame(raf); raf = 0; from = null; emit(stage, "pointerleave", [200, 160]); },
  };
}

function mountStage(stage, fig) {
  stage.setAttribute("data-hairline", fig.name);
  stage.setAttribute("aria-hidden", "true");
  const svg = HL.mk("svg", { viewBox: "0 0 400 320", "aria-hidden": "true" }, stage);
  try { fig.mount({ stage, svg, read: { textContent: "" } }, fig.range[1]); }
  catch (err) { console.error(`hairline ${fig.name}:`, err); return; }
  const drive = driver(stage, fig.tour ?? HL.LAP), cell = stage.closest(".hover");
  cell.addEventListener("pointerenter", () => drive.start());
  cell.addEventListener("pointerleave", () => drive.stop());
  cell.addEventListener("focus", () => drive.start());
  cell.addEventListener("blur", () => drive.stop());
}

const cell = (cls, label) => `<div class="cell"><div class="hover" tabindex="0"><div class="hl-stage ${cls}"></div></div>${label}</div>`;
const panel = (theme, slug, alt) => `<div class="panel ${theme}">${cell("w120", "120px · " + theme)}${cell("w400", "400px · " + theme)}${
  theme === "light" ? `<div class="cell static"><img src="svg/${slug}.svg" alt="${alt}">static svg/${slug}.svg</div>` : ""}</div>`;

(async () => {
  HL.inject(document);
  const index = await (await fetch("figures/index.json")).json();
  const list = document.getElementById("list");
  for (const { slug, section, alt } of index) {
    let fig;
    new Function("HL", "hairline", await (await fetch(`figures/${slug}.js`)).text())(HL, (f) => { fig = f; });
    const el = document.createElement("section");
    el.className = "fig";
    el.innerHTML = `<h2>${section}</h2><div class="meta"><code>figures/${slug}.js</code> · alt: ${alt}</div>
      <div class="panels">${panel("light", slug, alt)}${panel("dark", slug, alt)}</div>`;
    list.appendChild(el);
    el.querySelectorAll(".hl-stage").forEach((stage) => mountStage(stage, fig));
  }
})();
</script>
</body>
</html>
